name: Validate cleaned issue-fix tests

on:
  push:
    branches: [ci/issue-fixes-validation]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_DEV_OPT_LEVEL: "0"
  XDG_RUNTIME_DIR: /tmp

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - issue: 2600
            branch: fix/2600-ruler-corner-clipping
            revision: 38352834d94ef6dfb47cced1bd7ae207039ac0b6
            regression: ruler_ticks_labels_and_pointer_stay_out_of_the_origin_corner
          - issue: 2602
            branch: fix/2602-status-dimension-units
            revision: a29d2d28462a225b4106d444334c7a7ab94b726e
            regression: status_bar_updates_dimensions_after_a_ruler_preference_change
          - issue: 2392
            branch: fix/2392-workspace-host-flags
            revision: 37ff1dec4e2d30b18d61826e4d7a9003ec06561e
            regression: saved_workspace_keeps_host_menu_and_rail_hidden_in_the_rendered_ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: issue-fixes-ui
          cache-on-failure: true
      - name: Check formatting
        run: |
          mkdir -p evidence
          cargo fmt --all --check
      - name: Prove regression fails without the production fix
        env:
          ISSUE: ${{ matrix.issue }}
          REGRESSION: ${{ matrix.regression }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          issue = os.environ['ISSUE']
          name = {'2479': 'palette', '2600': 'rulers', '2602': 'chrome_ui', '2392': 'dock'}[issue]
          p = Path(f'crates/ui-egui/src/{name}.rs')
          s = p.read_text()
          Path('/tmp/fixed-source.rs').write_text(s)
          Path('/tmp/fixed-source-path').write_text(str(p))
          if issue == '2479':
              fix = '.filter(|m| m.label != "---")'
              assert s.count(fix) == 1
              s = s.replace(fix, '')
          elif issue == '2600':
              fix = 'let p = p.with_clip_rect(if vertical { left } else { top });'
              assert s.count(fix) == 1
              s = s.replace(fix, '').replace('p.with_clip_rect(top).line_segment', 'p.line_segment').replace('p.with_clip_rect(left).line_segment', 'p.line_segment')
          elif issue == '2602':
              fix = '&app.session.prefs().units_and_rulers'
              assert s.count(fix) == 1
              s = s.replace(fix, '&Default::default()')
          else:
              for fix in ['p.menu_bar = app.ui.panels.menu_bar;', 'p.rail = app.ui.panels.rail;']:
                  assert s.count(fix) == 1
                  s = s.replace(fix, '')
              s = s.replace('if let Some(mut p)', 'if let Some(p)')
          p.write_text(s)
          PY
          set +e
          cargo --config 'profile.dev.package."*".opt-level=0' test -p photocraft-ui-egui --locked --lib "$REGRESSION" -- --nocapture > evidence/before-test.log 2>&1
          result=$?
          set -e
          cat evidence/before-test.log
          cp /tmp/fixed-source.rs "$(cat /tmp/fixed-source-path)"
          test "$result" -ne 0
          grep -q 'test result: FAILED' evidence/before-test.log
      - name: Verify regression passes with the production fix
        env:
          REGRESSION: ${{ matrix.regression }}
        run: cargo --config 'profile.dev.package."*".opt-level=0' test -p photocraft-ui-egui --locked --lib "$REGRESSION" -- --nocapture
      - name: UI unit, integration and documentation tests
        run: cargo --config 'profile.dev.package."*".opt-level=0' test -p photocraft-ui-egui --locked
      - name: Clippy
        run: cargo --config 'profile.dev.package."*".opt-level=0' clippy -p photocraft-ui-egui --all-targets --locked -- -D warnings
      - name: Dependency layering
        run: cargo --config 'profile.dev.package."*".opt-level=0' xtask layers
      - name: WebAssembly checks
        run: cargo --config 'profile.dev.package."*".opt-level=0' xtask wasm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-${{ matrix.issue }}-validation
          path: evidence/
          if-no-files-found: error
